name: Xbox target probe

on:
  push:
    branches: [xbox/bootstrap]
    paths: [.github/workflows/xbox-target-probe.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nxdk-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: XboxDev/nxdk
          ref: 14d5ee97e73347c973f1f57b68b79ec08c9e77f2
          path: sdk/nxdk
          submodules: recursive
          persist-credentials: false
      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - name: Export pinned SDK sources (no game files)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export evidence
          git -C sdk/nxdk rev-parse HEAD > export/NXDK-REVISION.txt
          git -C sdk/nxdk submodule status --recursive > export/NXDK-SUBMODULES.txt
          tar --exclude-vcs -C sdk -czf export/nxdk-source.tar.gz nxdk
          sha256sum export/nxdk-source.tar.gz > export/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nxdk-pinned-source
          path: export/
          retention-days: 14
      - name: Build SDK hello XBE (toolchain check, not game boot)
        shell: bash
        run: |
          set -euo pipefail
          export NXDK_DIR="$PWD/sdk/nxdk"
          export PATH="$NXDK_DIR/bin:$PATH"
          clang --version > evidence/compiler.txt
          make -C "$NXDK_DIR/samples/hello" GEN_XISO= -j2 V=1 2>&1 | tee evidence/nxdk-hello-build.log
          cp "$NXDK_DIR/samples/hello/bin/default.xbe" evidence/nxdk-hello.xbe
      - name: Probe unmodified CPU helpers for Xbox
        shell: bash
        run: |
          set -euo pipefail
          export NXDK_DIR="$PWD/sdk/nxdk"
          export PATH="$NXDK_DIR/bin:$PATH"
          nxdk-cc -std=c11 -O1 -Isrc -c src/cpu/cpu.c -o evidence/cpu-xbox.obj 2>&1 | tee evidence/cpu-xbox-build.log
          llvm-readobj --file-headers evidence/cpu-xbox.obj > evidence/cpu-xbox-format.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nxdk-target-evidence
          path: evidence/
          retention-days: 14
