name: Xbox bootstrap baseline

on:
  push:
    branches: [xbox/bootstrap]
    paths:
      - .github/workflows/xbox-bootstrap.yml
      - src/**
      - tests/**
      - CMakeLists.txt
      - tools/timing/**
      - tools/function_pipeline/**
      - cmake/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c-backend-baseline:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Export reproducible source snapshot (no game files)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          git rev-parse HEAD > export/REVISION.txt
          git submodule status --recursive > export/SUBMODULES.txt
          tar --exclude-vcs --exclude='./export' --exclude='./build' -czf export/DolRecompX-source.tar.gz .
          sha256sum export/DolRecompX-source.tar.gz > export/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DolRecompX-bootstrap-source
          path: export/
          retention-days: 14
      - name: Configure portable C backend
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDOLRECOMP_ENABLE_LLVM=OFF
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test baseline
        run: ctest --test-dir build --output-on-failure
      - name: Test offline Wii platform selection
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_cli_offline.py build/dolrecomp 2>&1 | tee build/offline-cli.log
      - name: Validate opt-in bounded synthetic clock (no CPU integration)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-clock -DCMAKE_BUILD_TYPE=Release -DDOLRECOMP_ENABLE_SYNTHETIC_CLOCK=ON
          cmake --build build-clock --parallel 2 --target synthetic_clock_test clock_contract_test
          ctest --test-dir build-clock --output-on-failure -R '^(synthetic_clock|clock_contract|synthetic_clock_tools)$'
      - name: Collect build evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          cp export/REVISION.txt export/SUBMODULES.txt evidence/
          cp build/Testing/Temporary/LastTest.log evidence/ 2>/dev/null || true
          cp build-clock/Testing/Temporary/LastTest.log evidence/ClockLastTest.log 2>/dev/null || true
          cp build/offline-cli.log evidence/ 2>/dev/null || true
          cp build/CMakeCache.txt evidence/ 2>/dev/null || true
          find build -maxdepth 2 -type f -iname '*dolrecomp*' -executable -exec cp {} evidence/ \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DolRecompX-c-backend-baseline
          path: evidence/
          retention-days: 14

  optional-function-pipeline:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install optional host analysis dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libz3-4 clang
      - name: Verify default-off dependency boundary
        run: |
          cmake -S . -B build-off -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=/nonexistent/disabled-cxx -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=TRUE
          cmake --build build-off --parallel 2
          ctest --test-dir build-off --output-on-failure
      - name: Build opt-in analysis and synthetic proof tools
        run: |
          cmake -S . -B build-analysis -DCMAKE_BUILD_TYPE=Release -DDOLRECOMP_ENABLE_VERIFIED_IDIOMS=ON
          cmake --build build-analysis --parallel 2
      - name: Validate certificates, fresh proofs and failure atomicity
        run: ctest --test-dir build-analysis --output-on-failure --parallel 2
      - name: Check default production output is unchanged
        run: |
          cmp build-off/c_execute_generated.c build-analysis/c_execute_generated.c
          cmp build-off/branch_link_generated.c build-analysis/branch_link_generated.c
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DolRecompX-function-pipeline-tests
          path: |
            build-analysis/Testing/Temporary/LastTest.log
            build-analysis/function-pipeline-identity.json
          retention-days: 14
